<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#91d900"><meta name="description" content="VOX. Tienes más potencial del que piensas.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./auth.css?v=auth12"><script defer src="./auth.js?v=auth10"></script>
<title>VOX — Tienes más potencial del que piensas</title></head>
<body class="auth-page">
<div class="auth-atmosphere" aria-hidden="true"><span class="orb orb-blue"></span><span class="orb orb-cream"></span><span class="orb orb-dark"></span></div>
<main class="auth-shell" id="authShell">
<header class="auth-top"><span class="top-mark">VOX</span><span class="top-note">TU ESPACIO PARA CRECER</span></header>
<section class="auth-card" id="authAccess" aria-labelledby="authHeading">
<div class="mascot-wrap"><img class="vox-mascot" src="./vox-mascot.svg" alt="Mascota de VOX, una carita verde de ojos grandes"></div>
<header class="auth-brand"><a href="./auth.html" class="brand-lockup" aria-label="VOX, inicio"><span class="brand-name">Vox</span></a><p class="brand-tagline">Tienes más potencial del que piensas.</p></header>
<h1 id="authHeading" class="sr-only">Inicio de sesión</h1>
<form id="authForm" class="auth-form" novalidate>
<label class="field-label" id="emailField" for="authEmail"><span class="sr-only">Correo electrónico</span><span class="input-wrap"><span class="field-icon" aria-hidden="true">✉</span><input id="authEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Correo electrónico" required></span><small class="field-error" id="emailError"></small></label>
<label class="field-label" id="passwordField" for="authPassword"><span class="sr-only">Contraseña</span><span class="input-wrap"><span class="field-icon lock-icon" aria-hidden="true">⌑</span><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Contraseña" required><button class="password-toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña">Ver</button></span><small class="field-error" id="passwordError"></small></label>
<label class="field-label confirm-field" id="confirmField" for="authConfirm" hidden><span class="sr-only">Confirma tu contraseña</span><span class="input-wrap"><span class="field-icon lock-icon" aria-hidden="true">⌑</span><input id="authConfirm" name="password-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Confirma tu contraseña"></span><small class="field-error" id="confirmError"></small></label>
<button class="submit-button" id="authSubmit" type="submit"><span class="submit-label">Entrar a VOX</span></button><p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
</form>
<div class="auth-divider" aria-hidden="true"><span></span><p id="authDividerText">¿Aún no tienes cuenta?</p><span></span></div>
<div class="auth-tabs" role="tablist" aria-label="Acceso a VOX"><button class="auth-tab" type="button" data-auth-mode="login" role="tab" aria-selected="true">INICIAR SESIÓN</button><button class="auth-tab create-tab" type="button" data-auth-mode="signup" role="tab" aria-selected="false">CREAR UNA CUENTA</button></div>
<p class="auth-footnote">Un paso a la vez. Tu voz también se entrena.</p>
</section>
<footer class="auth-footer"><span class="footer-dot"></span><p>VOX · HABLA CON CONFIANZA</p></footer>
</main>
<div class="success-scene" id="successScene" aria-hidden="true"><div class="success-mascot">✓</div><p>Bienvenido a VOX</p><span>Tu espacio te espera.</span></div>
</body></html>
