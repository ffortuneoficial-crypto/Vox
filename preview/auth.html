<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="description" content="VOX — Entrenamiento de voz y comunicación.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./auth.css?v=auth20">
<script defer src="./auth.js?v=auth14"></script>
<title>VOX — Acceso</title>
</head>
<body class="auth-page">
<div class="auth-decoration" aria-hidden="true">
  <span class="decor-circle circle-one"></span><span class="decor-circle circle-two"></span>
  <span class="decor-circle circle-three"></span><span class="decor-circle circle-four"></span>
  <span class="decor-dot dot-one"></span><span class="decor-dot dot-two"></span>
</div>
<main class="auth-shell" id="authShell">
  <section class="auth-card auth-access" id="authAccess" aria-labelledby="authHeading">
    <div class="auth-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.7 14.8 8l5.5 2.4-5.5 2.5-2.8 5.4-2.6-5.4-5.6-2.5L9.4 8 12 2.7Z"/><path d="m17.8 15.5 1.1 2.1 2.1 1-2.1 1-1.1 2.1-1-2.1-2.1-1 2.1-1 1-2.1Z"/></svg>
    </div>
    <div class="auth-heading">
      <h1 id="authHeading">Bienvenido</h1>
      <p id="authSubtitle">Inicia sesión para continuar</p>
    </div>
    <form id="authForm" class="auth-form" novalidate>
      <label class="field-label" id="nameField" for="authName" hidden>
        <span class="sr-only">Nombre</span>
        <span class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.7-3.6 3.2-5.5 7.5-5.5s6.8 1.9 7.5 5.5"/></svg>
          <input id="authName" name="name" type="text" autocomplete="name" placeholder="Nombre completo">
        </span>
        <small class="field-error" id="nameError"></small>
      </label>
      <label class="field-label" id="emailField" for="authEmail">
        <span class="sr-only">Correo electrónico</span>
        <span class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="5" width="18.4" height="14" rx="2.2"/><path d="m4 7 8 6 8-6"/></svg>
          <input id="authEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Correo electrónico" required>
        </span>
        <small class="field-error" id="emailError"></small>
      </label>
      <label class="field-label" id="passwordField" for="authPassword">
        <span class="sr-only">Contraseña</span>
        <span class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Contraseña" required>
          <button class="password-toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
        <small class="field-error" id="passwordError"></small>
      </label>
      <label class="field-label" id="confirmField" for="authConfirm" hidden>
        <span class="sr-only">Confirmar contraseña</span>
        <span class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="authConfirm" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirmar contraseña">
        </span>
        <small class="field-error" id="confirmError"></small>
      </label>
      <div class="form-meta" id="formMeta">
        <span class="secure-note"><i></i> Conexión protegida</span>
      </div>
      <button class="submit-button" id="authSubmit" type="submit"><span class="submit-label">Iniciar sesión</span></button>
      <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
    </form>
    <footer class="auth-footer">
      <span id="authModePrompt">¿No tienes una cuenta?</span>
      <button id="authModeLink" type="button">Crear cuenta</button>
    </footer>
    <div class="auth-bottom-mark" aria-hidden="true"><span></span><b>VOX</b><span></span></div>
  </section>
</main>
<div class="success-scene" id="successScene" aria-hidden="true">
  <div class="success-mark"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></div>
  <p>Bienvenido a VOX</p><span>Tu espacio te espera.</span>
</div>
</body>
</html>
