<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<meta name="description" content="VOX. Accede a tu espacio de entrenamiento.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./auth.css?v=auth10">
<script defer src="./auth.js?v=auth08"></script>
<title>VOX — Inicio</title>
</head>
<body class="auth-page">
<main class="auth-shell" id="authShell">
  <header class="auth-brand">
    <a href="./auth.html" class="brand-lockup" aria-label="VOX, inicio">
      <span class="brand-symbol-wrap" aria-hidden="true">
        <svg class="brand-symbol" viewBox="0 0 90 74" focusable="false">
          <path class="v-main" d="M8 8 C18 27 29 48 40 65 C52 46 65 26 77 8"/>
          <path class="v-double" d="M49 65 C60 46 72 26 84 8"/>
        </svg>
      </span>
      <span class="brand-name">VOX</span>
    </a>
  </header>

  <div class="auth-content">
    <section class="auth-access" id="authAccess" aria-labelledby="authHeading">
      <div class="form-heading">
        <h1 id="authHeading">INICIO</h1>
        <p id="authSubheading" hidden></p>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Acceso a VOX">
        <button class="auth-tab active" type="button" data-auth-mode="login" role="tab" aria-selected="true">Iniciar sesión</button>
        <button class="auth-tab" type="button" data-auth-mode="signup" role="tab" aria-selected="false">Crear cuenta</button>
      </div>

      <form id="authForm" class="auth-form" novalidate>
        <label class="field-label" id="emailField" for="authEmail">
          <span>Correo electrónico</span>
          <span class="input-wrap">
            <input id="authEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="nombre@correo.com" required>
          </span>
          <small class="field-error" id="emailError"></small>
        </label>

        <label class="field-label" id="passwordField" for="authPassword">
          <span>Contraseña</span>
          <span class="input-wrap">
            <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Tu contraseña" required>
            <button class="password-toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña">Ver</button>
          </span>
          <small class="field-error" id="passwordError"></small>
        </label>

        <label class="field-label confirm-field" id="confirmField" for="authConfirm" hidden>
          <span>Confirma tu contraseña</span>
          <span class="input-wrap">
            <input id="authConfirm" name="password-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Escríbela otra vez">
          </span>
          <small class="field-error" id="confirmError"></small>
        </label>

        <button class="submit-button" id="authSubmit" type="submit">
          <span class="submit-label">Entrar a VOX</span>
          <span class="submit-arrow" aria-hidden="true">↗</span>
        </button>
        <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </div>
</main>

<div class="success-scene" id="successScene" aria-hidden="true">
  <svg class="success-v" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M17 20 60 101 103 20"/>
    <path d="M69 101 112 20"/>
  </svg>
  <p>Bienvenido a VOX</p>
  <span>Acceso correcto.</span>
</div>
</body>
</html>
