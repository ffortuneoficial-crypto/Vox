name: Deploy VOX to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "auth.html"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site/css _site/js _site/icons
          cp index.html auth.html manifest.webmanifest sw.js _site/
          cp css/app.css _site/css/
          cp js/app.js _site/js/
          cp icons/vox.svg _site/icons/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
